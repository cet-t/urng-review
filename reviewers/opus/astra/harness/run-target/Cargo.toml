[package]
name = "opus-review-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["simd"]
simd = []
# reviewed-variant switches for the few public API differences
v_sol = []
v_astra = []

[dependencies]
urng = { path = "../_src", features = ["full"] }
pastey = "0.2"
rand_core = "0.10"

[[bin]]
name = "dump"
path = "../common/dump.rs"

[profile.release]
opt-level = 3
debug = false

[[bin]]
name = "cabi"
path = "../common/cabi.rs"


[[bin]]
name = "probe"
path = "../common/probe.rs"

[[bin]]
name = "numeric"
path = "../common/numeric.rs"


[[bin]]
name = "bench"
path = "../common/bench.rs"

# same codegen settings as urng's own [profile.release] (used for the shipped cdylib)
[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1

